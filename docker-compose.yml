
version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: calendar-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: calendar-app
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - calendar-network

  # Backend API
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: calendar-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: MONGODB_URI=MONGODB_URI=mongodb+srv://Guruprasad_H_M:Guru%402004@cluster0.sdiopyr.mongodb.net/calendar-app?retryWrites=true&w=majority&appName=Cluster0
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      CLIENT_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - calendar-network

  # Frontend (for development)
  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    container_name: calendar-client
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - calendar-network

  # Redis (for session storage and caching)
  redis:
    image: redis:7-alpine
    container_name: calendar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - calendar-network

volumes:
  mongodb_data:
  redis_data:

networks:
  calendar-network:
    driver: bridge
